<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Œil du monde</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg:#0e1a24; --panel:#14232f; --line:#27404f; --ink:#e6eef2; --dim:#8fa5b2; --accent:#f2b134; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 "Segoe UI",system-ui,sans-serif; }
  #map { position:absolute; inset:0; background:#0b141b; }
  .bar { position:absolute; z-index:1000; top:12px; left:12px; right:12px; display:flex; gap:8px; flex-wrap:wrap; pointer-events:none; }
  .box { pointer-events:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  form.box { gap:6px; }
  input[type=text], select { background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  input[type=text] { width:min(300px,55vw); }
  button { background:var(--accent); color:#1a1305; border:0; border-radius:6px; padding:6px 12px; font:inherit; font-weight:600; cursor:pointer; }
  button:focus-visible,input:focus-visible,select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  label { display:inline-flex; align-items:center; gap:6px; color:var(--dim); cursor:pointer; }
  label:has(input:checked) { color:var(--ink); }
  input[type=range] { accent-color:var(--accent); width:100px; }
  .val { min-width:3ch; color:var(--ink); text-align:right; }
  #status { position:absolute; z-index:1000; left:12px; bottom:28px; max-width:min(440px,90vw); font-size:12px; color:var(--dim); display:block; }
  #status b { color:var(--ink); font-weight:600; }
</style>
</head>
<body>
<div id="map"></div>

<div class="bar">
  <form class="box" id="search">
    <input type="text" id="q" placeholder="Ville, adresse, monument…" aria-label="Rechercher un lieu">
    <button>Aller</button>
  </form>
  <div class="box">
    <select id="base" aria-label="Fond de carte">
      <option value="esri">Satellite HD (Esri)</option>
      <option value="eox">Satellite Sentinel-2</option>
      <option value="nasa">Satellite NASA (hier)</option>
      <option value="plan">Plan des rues</option>
    </select>
    <label><input type="checkbox" id="l-lab" checked>Noms</label>
  </div>
  <div class="box">
    <label for="sharp">Netteté</label><input type="range" id="sharp" min="0" max="100" value="40"><span class="val" id="sharp-v">40</span>
    <label for="shad">Ombres</label><input type="range" id="shad" min="0" max="100" value="35"><span class="val" id="shad-v">35</span>
    <select id="model" aria-label="Modèle IA" title="Rapide = léger ; Détaillé = plus fin mais beaucoup plus lent">
      <option value="slim">IA rapide</option>
      <option value="medium" selected>IA équilibrée</option>
      <option value="thick">IA détaillée</option>
    </select>
    <label title="Super-résolution par réseau de neurones (ESRGAN), calculée dans le navigateur. Plus lent."><input type="checkbox" id="l-ai">IA super-résolution</label>
  </div>
  <div class="box">
    <label for="every">Actualiser</label>
    <select id="every" aria-label="Fréquence d'actualisation">
      <option value="0">jamais</option>
      <option value="60000">1 min</option>
      <option value="300000" selected>5 min</option>
      <option value="900000">15 min</option>
    </select>
    <button type="button" id="now">Maintenant</button>
  </div>
</div>
<div id="status" class="box">Chargement…</div>

<script>
const $ = id => document.getElementById(id);
const MAX_ZOOM = 22;

const map = L.map('map', { worldCopyJump:true, zoomControl:false, maxZoom:MAX_ZOOM, zoomSnap:0.25, zoomDelta:0.5 })
  .setView([50.85, 4.35], 8);
L.control.zoom({ position:'bottomright' }).addTo(map);

const msgs = {};
function say(k, v) {
  msgs[k] = v + ' <i>(' + new Date().toLocaleTimeString('fr-FR') + ')</i>';
  $('status').innerHTML = Object.values(msgs).join('<br>');
}

/* =====================================================
   Traitements d'image (tous calculés dans le navigateur)
   ===================================================== */
let sharpAmount = 0.4;   // 0 à 1
let shadowAmount = 0.35; // 0 à 1
let aiOn = false, upscaler = null;

/* Éclaircit les zones sombres (courbe gamma) : révèle ce qui est noyé dans l'ombre */
function liftShadows(ctx, w, h, a) {
  const g = 1 + a * 1.4, lut = new Uint8ClampedArray(256);
  for (let i = 0; i < 256; i++) lut[i] = 255 * Math.pow(i / 255, 1 / g);
  const im = ctx.getImageData(0, 0, w, h), d = im.data;
  for (let i = 0; i < d.length; i += 4) { d[i] = lut[d[i]]; d[i+1] = lut[d[i+1]]; d[i+2] = lut[d[i+2]]; }
  ctx.putImageData(im, 0, 0);
}

/* Flou par boîte séparable sur un tableau de luminance */
function boxBlur(src, w, h, r) {
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h), n = 2 * r + 1;
  for (let y = 0; y < h; y++) {
    let acc = 0; const o = y * w;
    for (let k = -r; k <= r; k++) acc += src[o + Math.min(w - 1, Math.max(0, k))];
    for (let x = 0; x < w; x++) {
      tmp[o + x] = acc / n;
      acc += src[o + Math.min(w - 1, x + r + 1)] - src[o + Math.max(0, x - r)];
    }
  }
  for (let x = 0; x < w; x++) {
    let acc = 0;
    for (let k = -r; k <= r; k++) acc += tmp[Math.min(h - 1, Math.max(0, k)) * w + x];
    for (let y = 0; y < h; y++) {
      out[y * w + x] = acc / n;
      acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x];
    }
  }
  return out;
}

/* Détails : masque flou sur la luminance uniquement (pas de franges colorées)
   + un peu de contraste local (échelle large) pour faire ressortir toits, routes, haies.
   Le seuil évite d'amplifier le bruit de compression JPEG. */
function sharpen(ctx, w, h, a) {
  const im = ctx.getImageData(0, 0, w, h), d = im.data, N = w * h;
  const L = new Float32Array(N);
  for (let i = 0, p = 0; p < N; i += 4, p++) L[p] = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
  const sc = Math.max(1, Math.round(w / 256));
  const fine = boxBlur(L, w, h, sc), wide = boxBlur(L, w, h, 4 * sc);
  const T = 1.5;
  for (let i = 0, p = 0; p < N; i += 4, p++) {
    let f = L[p] - fine[p];
    f = Math.abs(f) < T ? 0 : f - Math.sign(f) * T;
    const add = a * (2.2 * f + 0.7 * (L[p] - wide[p]));
    for (let k = 0; k < 3; k++) { const v = d[i+k] + add; d[i+k] = v < 0 ? 0 : v > 255 ? 255 : v; }
  }
  ctx.putImageData(im, 0, 0);
}

/* Super-résolution IA : une seule tuile à la fois pour ne pas saturer la carte graphique */
let aiChain = Promise.resolve();
function enqueue(fn) { const p = aiChain.then(fn); aiChain = p.catch(() => {}); return p; }

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('Échec de chargement : ' + src));
    document.head.appendChild(s);
  });
}
const MODELS = {
  slim:   { g:'ESRGANSlim2x',   u:'https://cdn.jsdelivr.net/npm/@upscalerjs/esrgan-slim@1.0.0/dist/umd/models/esrgan-slim/src/x2/index.min.js' },
  medium: { g:'ESRGANMedium2x', u:'https://cdn.jsdelivr.net/npm/@upscalerjs/esrgan-medium@1.0.0/dist/umd/models/esrgan-medium/src/x2/index.min.js' },
  thick:  { g:'ESRGANThick2x',  u:'https://cdn.jsdelivr.net/npm/@upscalerjs/esrgan-thick@1.0.0/dist/umd/models/esrgan-thick/src/x2/index.min.js' }
};
let loadedModel = null;
async function loadAI(key) {
  if (upscaler && loadedModel === key) return;
  if (!window.tf) await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');
  if (!window.Upscaler) await loadScript('https://cdn.jsdelivr.net/npm/upscaler@1.0.0/dist/browser/umd/upscaler.min.js');
  const m = MODELS[key];
  if (!window[m.g]) await loadScript(m.u);
  await tf.ready();
  upscaler = new Upscaler({ model: window[m.g] });
  // préchauffage : évite les tuiles ratées pendant l'initialisation du GPU
  try { await upscaler.warmup([{ patchSize:64, padding:4 }]); } catch (e) {}
  loadedModel = key;
}

/* =====================================================
   Couche de tuiles avec traitement
   ===================================================== */
const ProcTile = L.TileLayer.extend({
  initialize(url, opt) {
    L.TileLayer.prototype.initialize.call(this, url, opt);
    this.on('tileunload', e => { e.tile._dead = true; });
  },
  createTile(coords, done) {
    const size = this.getTileSize();
    const canvas = document.createElement('canvas');
    canvas.width = size.x; canvas.height = size.y;
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => this._process(img, canvas, size).then(() => done(null, canvas), () => done(null, canvas));
    img.onerror = e => done(e, canvas);
    let url = this.getTileUrl(coords);
    if (this._bust) url += (url.includes('?') ? '&' : '?') + '_=' + this._bust;
    img.src = url;
    return canvas;
  },
  async _process(img, canvas, size) {
    const ctx = canvas.getContext('2d', { willReadFrequently:true });
    ctx.drawImage(img, 0, 0, size.x, size.y);
    if (!this.options.proc) return;
    let w = size.x, h = size.y;
    try {
      if (aiOn && upscaler && !canvas._dead) {
        const out = await enqueue(() => canvas._dead ? null : upscaler.upscale(canvas, { patchSize:64, padding:4, output:'base64' }));
        if (out) {
          const im = new Image(); im.src = out; await im.decode();
          canvas.width = w = im.width; canvas.height = h = im.height;
          ctx.drawImage(im, 0, 0);
        }
      }
      if (shadowAmount > 0) liftShadows(ctx, w, h, shadowAmount);
      if (sharpAmount > 0) sharpen(ctx, w, h, sharpAmount);
    } catch (e) { /* canvas protégé par le serveur ou IA indisponible : l'image reste telle quelle */ }
  },
  refresh() { this._bust = Date.now(); this.redraw(); }
});
const tiles = (url, opt) => new ProcTile(url, opt);

/* ---------- Fonds de carte ---------- */
const yesterday = () => new Date(Date.now() - 864e5).toISOString().slice(0, 10);

const bases = {
  esri: tiles('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { proc:true, maxNativeZoom:19, maxZoom:MAX_ZOOM, attribution:'Imagery © Esri, Maxar, Earthstar Geographics' }),
  eox: tiles('https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg',
    { proc:true, maxNativeZoom:13, maxZoom:MAX_ZOOM, attribution:'Sentinel-2 cloudless © EOX' }),
  nasa: null,
  plan: tiles('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    { proc:false, subdomains:'abcd', maxNativeZoom:20, maxZoom:MAX_ZOOM, attribution:'© OpenStreetMap contributors © CARTO' })
};
function makeNasa() {
  const d = yesterday();
  return tiles('https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/' + d + '/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg',
    { proc:true, maxNativeZoom:9, maxZoom:MAX_ZOOM, attribution:'NASA GIBS, ' + d });
}
bases.nasa = makeNasa();

const labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
  { maxNativeZoom:19, maxZoom:MAX_ZOOM });

/* ---------- Repli automatique si une source tombe ---------- */
const fallback = { esri:'eox', eox:'nasa', nasa:'plan' };
const errs = {};
let current = 'esri';
function watch(k) {
  bases[k].on('tileerror', () => {
    errs[k] = (errs[k] || 0) + 1;
    if (errs[k] === 8 && current === k && fallback[k]) {
      $('base').value = fallback[k]; setBase();
      say('base', '<b>Fond</b> : source indisponible, bascule automatique');
    }
  });
  bases[k].on('load', () => { errs[k] = 0; });
}
Object.keys(bases).forEach(watch);

function setBase() {
  Object.values(bases).forEach(l => map.removeLayer(l));
  map.removeLayer(labels);
  current = $('base').value;
  bases[current].addTo(map).bringToBack();
  if (current !== 'plan' && $('l-lab').checked) labels.addTo(map);
  say('base', '<b>Fond</b> : ' + $('base').selectedOptions[0].text);
}
$('base').addEventListener('change', setBase);
$('l-lab').addEventListener('change', setBase);

/* ---------- Curseurs et option IA ---------- */
function slider(id, apply, label) {
  let t;
  $(id).addEventListener('input', e => {
    $(id + '-v').textContent = e.target.value;
    apply(e.target.value / 100);
    clearTimeout(t);
    t = setTimeout(() => { bases[current].refresh(); say(id, '<b>' + label + '</b> : ' + e.target.value + ' %'); }, 250);
  });
}
slider('sharp', v => { sharpAmount = v; }, 'Netteté');
slider('shad', v => { shadowAmount = v; }, 'Ombres');

$('model').addEventListener('change', () => { if ($('l-ai').checked) $('l-ai').dispatchEvent(new Event('change')); });
$('l-ai').addEventListener('change', async e => {
  if (!e.target.checked) { aiOn = false; say('ai', '<b>IA</b> : désactivée'); bases[current].refresh(); return; }
  try {
    say('ai', '<b>IA</b> : chargement du modèle (première fois : quelques secondes)…');
    await loadAI($('model').value);
    aiOn = true;
    say('ai', '<b>IA</b> : active (' + $('model').selectedOptions[0].text + '), les tuiles s\'affinent une par une');
    bases[current].refresh();
  } catch (err) {
    aiOn = false; e.target.checked = false;
    say('ai', '<b>IA</b> : indisponible (' + err.message + ')');
  }
});

/* ---------- Actualisation régulière ---------- */
let timer = null;
function refreshAll() {
  if (current === 'nasa') {
    map.removeLayer(bases.nasa);
    bases.nasa = makeNasa(); watch('nasa');
    bases.nasa.addTo(map).bringToBack();
  } else {
    bases[current].refresh();
  }
  if (map.hasLayer(labels)) labels.redraw();
  say('ref', '<b>Actualisé</b>');
}
function schedule() {
  clearInterval(timer);
  const ms = +$('every').value;
  if (ms) timer = setInterval(() => { if (!aiOn) refreshAll(); }, ms);
  say('ref', ms ? '<b>Actualisation</b> : toutes les ' + ms / 60000 + ' min' : '<b>Actualisation</b> : désactivée');
}
$('every').addEventListener('change', schedule);
$('now').addEventListener('click', refreshAll);

/* ---------- Recherche de lieu (Nominatim) ---------- */
$('search').addEventListener('submit', async e => {
  e.preventDefault();
  const q = $('q').value.trim(); if (!q) return;
  try {
    const r = await (await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=fr&q=' + encodeURIComponent(q))).json();
    if (!r.length) { say('geo', '<b>Recherche</b> : lieu introuvable'); return; }
    const bb = r[0].boundingbox.map(Number);
    map.fitBounds([[bb[0], bb[2]], [bb[1], bb[3]]], { maxZoom:19 });
    say('geo', '<b>Lieu</b> : ' + r[0].display_name.split(',').slice(0, 2).join(','));
  } catch { say('geo', '<b>Recherche</b> : service indisponible'); }
});

/* ---------- Démarrage ---------- */
setBase();
schedule();
</script>
</body>
</html>
